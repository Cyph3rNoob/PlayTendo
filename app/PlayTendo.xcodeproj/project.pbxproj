			shellScript = "# Copie les moteurs d'émulation (frameworks) dans l'app.\nset -e\nCORES=\"${PROJECT_DIR}/../cores/ios\"\nif [ \"${PLATFORM_NAME}\" = \"iphonesimulator\" ]; then CORES=\"${PROJECT_DIR}/../cores/sim\"; fi\nif [ \"${PLATFORM_NAME}\" = \"macosx\" ]; then CORES=\"${PROJECT_DIR}/../cores/mac\"; fi\n# Mac : signature locale (« - ») si aucune identité n'est donnée (l'app ne se signe pas sinon).\nSIGN=\"${EXPANDED_CODE_SIGN_IDENTITY}\"\nif [ \"${PLATFORM_NAME}\" = \"macosx\" ] && [ -z \"${SIGN}\" ]; then SIGN=\"-\"; fi\nDEST=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\nmkdir -p \"${DEST}\"\nfor FW in \"${CORES}\"/*.framework; do\n  [ -d \"${FW}\" ] || continue\n  NAME=$(basename \"${FW}\")\n  # PS Vita mise de côté : VitaCore seulement dans une app compilée avec elle (PLAYTENDO_VITA=1 zsh scripts/build_app.sh).\n  if [ \"${NAME}\" = \"VitaCore.framework\" ]; then\n    case \" ${SWIFT_ACTIVE_COMPILATION_CONDITIONS} \" in\n      *\" PLAYTENDO_VITA \"*) ;;\n      *) rm -rf \"${DEST:?}/${NAME:?}\"; continue ;;\n    esac\n  fi\n  rm -rf \"${DEST:?}/${NAME:?}\"\n  cp -R \"${FW}\" \"${DEST}/\"\n  if [ \"${CODE_SIGNING_ALLOWED}\" != \"NO\" ] && [ -n \"${SIGN}\" ]; then\n    codesign --force --sign \"${SIGN}\" --timestamp=none \"${DEST}/${NAME}\"\n  fi\ndone\n# Fichiers d'accompagnement des moteurs (PPSSPP…).\nRES=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nfor A in \"${PROJECT_DIR}/../cores/assets\"/*; do\n  [ -d \"${A}\" ] || continue\n  ASSET=$(basename \"${A}\")\n  rm -rf \"${RES:?}/${ASSET:?}\"\n  cp -R \"${A}\" \"${RES}/\"\ndone\n";
